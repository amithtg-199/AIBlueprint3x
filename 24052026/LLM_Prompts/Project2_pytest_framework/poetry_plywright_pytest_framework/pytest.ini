[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --strict-config --html=reports/report.html --self-contained-html
markers =
    smoke: CI smoke tests or availability checks
    valid: happy path and functional API contract tests
    invalid: negative scenarios, validation, and error tests
    non_functional: performance, load, security, and concurrency checks
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_file = logs/framework.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s %(message)s
