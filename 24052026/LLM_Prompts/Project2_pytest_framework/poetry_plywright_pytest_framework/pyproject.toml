[tool.poetry]
name = "poetry-playwright-pytest-framework"
version = "0.1.0"
description = "Enterprise-grade API Test Automation Framework using Playwright APIRequestContext and pytest"
authors = ["QA Automation Team"]
readme = "README.md"
packages = [{ include = "framework" }]

[tool.poetry.dependencies]
python = "^3.9"
playwright = "^1.43.0"
pytest = "^8.1.1"
pytest-html = "^4.1.1"
pytest-xdist = "^3.5.0"
allure-pytest = "^2.13.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.3.4"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
